version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-reviewer-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_API_URL=http://ollama:11434/api/generate
      - OLLAMA_MODEL=llama3
      - DEBUG=True
    volumes:
      - ./database:/app/database
      - ./chroma_db:/app/chroma_db
    depends_on:
      - ollama
    dns:
      - 8.8.8.8
      - 1.1.1.1

  ollama:
    image: ollama/ollama:latest
    container_name: ai-reviewer-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  ollama_data:
